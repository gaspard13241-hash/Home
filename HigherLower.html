<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Higher or Lower: Social Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pirata+One&family=Righteous&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-primary: #0a0e27;
  --bg-secondary: #1a1f3a;
  --bg-card: #242942;
  --text-primary: #ffffff;
  --text-secondary: #a8b2d1;
  --accent-primary: #ff6b6b;
  --accent-secondary: #4ecdc4;
  --accent-gold: #ffd93d;
  --border-color: #3d4466;
  --shadow-glow: rgba(255, 107, 107, 0.3);
}

.light {
  --bg-primary: #fef6e4;
  --bg-secondary: #f7e8d0;
  --bg-card: #ffffff;
  --text-primary: #2b2d42;
  --text-secondary: #5a5a72;
  --accent-primary: #e63946;
  --accent-secondary: #06a77d;
  --accent-gold: #f4a261;
  --border-color: #d4c5b9;
}

body {
  background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
  color: var(--text-primary);
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  padding: 20px;
  margin: 0;
}

.logo h1 {
  font-family: "Orbitron", sans-serif;
  font-size: clamp(32px, 8vw, 72px);
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}
.logo p { font-family: "Righteous", cursive; color: var(--text-secondary); }

.score-bar {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 16px;
  padding: 20px;
  margin: 20px 0;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  align-items: center;
}
#timerValue {
  font-family: "Orbitron", sans-serif;
  font-size: 28px;
  color: var(--accent-secondary);
}
.timer-warning {
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { color: var(--accent-primary); transform: scale(1); }
  50% { color: var(--accent-gold); transform: scale(1.25); }
}

/* buttons */
button {
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: white;
  border: none;
  padding: 14px 24px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  min-width: 140px;
  margin: 5px;
}
button.secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 2px solid var(--border-color);
}

/* cards and game layout */
.game-board {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: center;
}
.vs {
  font-family: "Bebas Neue", cursive;
  font-size: 60px;
  color: var(--accent-gold);
  text-align: center;
}
.card {
  background: var(--bg-card);
  padding: 16px;
  border-radius: 20px;
  border: 2px solid var(--border-color);
}
.card img {
  width: 100%;
  border-radius: 12px;
  height: 240px;
  object-fit: cover;
}
.card-followers.hidden { color: var(--text-secondary); }
.card.correct { box-shadow: 0 0 20px var(--accent-secondary); }
.card.incorrect { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-content {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  border: 3px solid var(--accent-primary);
}
.final-score {
  font-family: "Orbitron", sans-serif;
  font-size: 48px;
  color: var(--accent-gold);
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>Higher or Lower</h1>
    <p>🔥 Social Showdown 🔥</p>
  </div>

  <div id="scoreBar" style="display:none;" class="score-bar">
    <div class="score-item"><span>⏱ Time:</span> <span id="timerValue">--</span></div>
    <div class="score-item"><span>Current:</span> <span id="scoreValue">0</span></div>
    <div class="score-item"><span>High:</span> <span id="highScoreValue">0</span></div>
    <div class="score-item"><button class="secondary" onclick="game.quit()">Exit</button></div>
  </div>

  <div id="gameArea"></div>
</div>

<script>
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
  document.documentElement.classList.add('light');
}

const game = {
  timeLimit: 60,
  timeRemaining: 60,
  timer: null,
  timerEnabled: false, // ✅ mode toggle

  sport_data: [
    { name: "Kylian Mbappé", followers: 127500000, description: "French footballer for Real Madrid.", country: "France", image: "https://upload.wikimedia.org/wikipedia/commons/8/83/Kylian_Mbappe_%28cropped%29.jpg" },
    { name: "Cristiano Ronaldo", followers: 500000000, description: "Portuguese football legend.", country: "Portugal", image: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Cristiano_Ronaldo_2018.jpg" },
    { name: "Lionel Messi", followers: 500000000, description: "Argentinian icon.", country: "Argentina", image: "https://upload.wikimedia.org/wikipedia/commons/8/8c/Lionel_Messi_20180626.jpg" },
    { name: "Virat Kohli", followers: 200000000, description: "Indian cricket superstar.", country: "India", image: "https://upload.wikimedia.org/wikipedia/commons/3/32/Virat_Kohli_%28cropped%29.jpg" },
    { name: "LeBron James", followers: 100000000, description: "Basketball legend.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/3/3c/LeBron_James_2019.jpg" }
  ],

  celebrities_data: [
    { name: "Selena Gomez", followers: 400000000, description: "Singer and actress.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/2/2d/Selena_Gomez_2019_by_Glenn_Francis.jpg" },
    { name: "Dwayne Johnson", followers: 300000000, description: "Actor and wrestler.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/f/f9/Dwayne_Johnson_2%2C_2018.jpg" },
    { name: "Kim Kardashian", followers: 350000000, description: "Media personality.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Kim_Kardashian_2019.jpg" },
    { name: "Ariana Grande", followers: 350000000, description: "Pop singer.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/6/69/Ariana_Grande_2019_by_Glenn_Francis.jpg" },
    { name: "Taylor Swift", followers: 250000000, description: "Singer-songwriter.", country: "USA", image: "https://upload.wikimedia.org/wikipedia/commons/f/f2/Taylor_Swift_June_2019.jpg" }
  ],

  score: 0,
  highScore: 0,
  currentData: [],
  cardA: null,
  cardB: null,
  usedCards: [],

  init() {
    this.showMenu();
  },

  showMenu() {
    document.getElementById("gameArea").innerHTML = `
      <div class="menu" style="text-align:center">
        <h2>Would you like to play with a timer?</h2>
        <div>
          <button onclick="game.chooseMode(true)">⏱ With Timer</button>
          <button onclick="game.chooseMode(false)">🚫 Without Timer</button>
        </div>
      </div>
    `;
    document.getElementById("scoreBar").style.display = "none";
    this.stopTimer();
  },

  chooseMode(useTimer) {
    this.timerEnabled = useTimer;
    document.getElementById("gameArea").innerHTML = `
      <div class="menu" style="text-align:center">
        <h2>Choose Game Mode</h2>
        <button onclick="game.startGame('sports')">🏆 Sports Stars</button>
        <button onclick="game.startGame('celebs')">🎬 Celebrities</button>
        <button onclick="game.startGame('mixed')">🌍 Mixed Mode</button>
      </div>
    `;
  },

  startGame(mode) {
    this.score = 0;
    this.usedCards = [];
    this.cardA = null;
    this.cardB = null;

    if (mode === "sports") this.currentData = [...this.sport_data];
    else if (mode === "celebs") this.currentData = [...this.celebrities_data];
    else this.currentData = [...this.sport_data, ...this.celebrities_data];

    document.getElementById("scoreBar").style.display = "flex";
    this.updateScore();

    // Timer mode only
    if (this.timerEnabled) {
      this.startTimer();
    } else {
      document.getElementById("timerValue").textContent = "∞";
    }

    this.nextRound();
  },

  startTimer() {
    this.stopTimer();
    this.timeRemaining = this.timeLimit;
    const timerEl = document.getElementById("timerValue");
    timerEl.textContent = this.timeRemaining;
    timerEl.classList.remove("timer-warning");
    this.timer = setInterval(() => {
      this.timeRemaining--;
      timerEl.textContent = this.timeRemaining;
      if (this.timeRemaining <= 10) timerEl.classList.add("timer-warning");
      if (this.timeRemaining <= 0) {
        this.stopTimer();
        this.gameOver("⏰ Time’s up!");
      }
    }, 1000);
  },

  stopTimer() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  },

  nextRound() {
    const available = this.currentData.filter(c => !this.usedCards.includes(c));
    if (available.length < 2) this.usedCards = [];
    if (this.cardB) this.cardA = this.cardB;
    else this.cardA = available[Math.floor(Math.random() * available.length)];
    this.usedCards.push(this.cardA);
    this.cardB = available.filter(c => c !== this.cardA)[Math.floor(Math.random() * (available.length - 1))];
    this.renderGame();
  },

  renderGame() {
    const a = this.cardA, b = this.cardB;
    document.getElementById("gameArea").innerHTML = `
      <div class="game-board">
        <div class="card revealed">
          <img src="${a.image}" alt="${a.name}" />
          <h3>${a.name}</h3>
          <p>${a.country}</p>
          <div class="card-followers">${this.format(a.followers)} followers</div>
        </div>
        <div class="vs">VS</div>
        <div class="card" id="cardB">
          <img src="${b.image}" alt="${b.name}" />
          <h3>${b.name}</h3>
          <p>${b.country}</p>
          <div class="card-followers hidden">??? followers</div>
          <div style="display:flex;gap:10px;margin-top:10px;">
            <button onclick="game.makeGuess('higher')">📈 Higher</button>
            <button onclick="game.makeGuess('lower')">📉 Lower</button>
          </div>
        </div>
      </div>
    `;
  },

  makeGuess(choice) {
    const isHigher = this.cardB.followers > this.cardA.followers;
    const correct = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);
    const cardB = document.getElementById("cardB");
    const foll = cardB.querySelector(".card-followers");
    foll.textContent = `${this.format(this.cardB.followers)} followers`;
    foll.classList.remove("hidden");

    if (correct) {
      this.score++;
      this.updateScore();
      cardB.classList.add("correct");

      // ✅ +5 seconds reward if timer mode active
      if (this.timerEnabled && this.timer) {
        this.timeRemaining = Math.min(this.timeRemaining + 5, this.timeLimit + 20);
        document.getElementById("timerValue").textContent = this.timeRemaining;
      }

      setTimeout(()=>this.nextRound(), 1000);
    } else {
      cardB.classList.add("incorrect");
      if (this.timerEnabled) this.stopTimer();
      setTimeout(()=>this.gameOver("❌ Wrong Guess!"), 1000);
    }
  },

  gameOver(reason="Game Over!") {
    if (this.score > this.highScore) this.highScore = this.score;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
      <div class="modal-content">
        <h2>${reason}</h2>
        <p>Your final score:</p>
        <div class="final-score">${this.score}</div>
        <p>High score: ${this.highScore}</p>
        <div style="margin-top:20px;">
          <button onclick="modal.remove(); game.startGame('${this.getMode()}')">Play Again</button>
          <button class="secondary" onclick="modal.remove(); game.showMenu()">Main Menu</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
  },

  getMode() {
    if (this.currentData.length === this.sport_data.length) return "sports";
    if (this.currentData.length === this.celebrities_data.length) return "celebs";
    return "mixed";
  },

  updateScore() {
    document.getElementById("scoreValue").textContent = this.score;
    document.getElementById("highScoreValue").textContent = this.highScore;
  },

  quit() {
    this.stopTimer();
    this.showMenu();
  },

  format(num) {
    if (num >= 1e6) return (num/1e6).toFixed(1)+"M";
    if (num >= 1e3) return (num/1e3).toFixed(1)+"K";
    return num;
  }
};
game.init();
</script>

<footer style="text-align:center;margin-top:40px;">
  © 2025 Gaspard | Built with 💡 curiosity.
</footer>
</body>
</html>
