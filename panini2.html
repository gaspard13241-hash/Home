<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panini World Cup 2026 Batch Organizer</title>
    <style>
        :root {
            --primary-color: #8a1538;
            --secondary-color: #eeeee4;
            --text-color: #333333;
            --accent-color: #da291c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            border-top: 8px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 24px;
        }

        h2 {
            font-size: 14px;
            color: #666;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .results-list {
            margin-top: 20px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .sticker-row {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sticker-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag {
            font-size: 24px;
        }

        .sticker-code {
            font-weight: bold;
            color: var(--accent-color);
            background: #ffebee;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        .country-name {
            font-size: 16px;
            font-weight: 600;
        }

        .page-badge {
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .no-result {
            color: #999;
            font-style: italic;
            margin-top: 20px;
            text-align: center;
        }
        
        .error-code {
            color: #777;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 World Cup 2026 ⚽</h1>
    <h2>Panini Batch Book-Order Organizer</h2>
    
    <div class="search-box">
        <textarea id="search-input" placeholder="Paste sticker codes here (e.g., BEL1, CPV7, HAI19...)" autocomplete="off" autofocus></textarea>
    </div>

    <div id="results-container" class="results-list"></div>
    <div id="empty-msg" class="no-result">Paste a list of stickers to sort them by album order</div>
</div>

<script>
    const teams = [
        { name: "Algeria", code: "ALG", flag: "🇩🇿", pages: "Pages 84–85" },
        { name: "Argentina", code: "ARG", flag: "🇦🇷", pages: "Pages 82–83" },
        { name: "Australia", code: "AUS", flag: "🇦🇺", pages: "Pages 36–37" },
        { name: "Austria", code: "AUT", flag: "🇦🇹", pages: "Pages 86–87" },
        { name: "Belgium", code: "BEL", flag: "🇧🇪", pages: "Pages 58–59" },
        { name: "Bosnia-Herzegovina", code: "BIH", flag: "🇧🇦", pages: "Pages 18–19" },
        { name: "Brazil", code: "BRA", flag: "🇧🇷", pages: "Pages 24–25" },
        { name: "Cabo Verde", code: "CPV", flag: "🇨🇻", pages: "Pages 68–69" },
        { name: "Canada", code: "CAN", flag: "🇨🇦", pages: "Pages 16–17" },
        { name: "Colombia", code: "COL", flag: "🇨🇴", pages: "Pages 96–97" },
        { name: "Congo DR", code: "COD", flag: "🇨🇩", pages: "Pages 92–93" },
        { name: "Croatia", code: "CRO", flag: "🇭🇷", pages: "Pages 100–101" },
        { name: "Curaçao", code: "CUW", flag: "🇨🇼", pages: "Pages 42–43" },
        { name: "Czechia", code: "CZE", flag: "🇨🇿", pages: "Pages 14–15" },
        { name: "Côte d'Ivoire", code: "CIV", flag: "🇨🇮", pages: "Pages 44–45" },
        { name: "Ecuador", code: "ECU", flag: "🇪🇨", pages: "Pages 46–47" },
        { name: "Egypt", code: "EGV", flag: "🇪🇬", pages: "Pages 60–61" },
        { name: "England", code: "ENG", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", pages: "Pages 98–99" },
        { name: "France", code: "FRA", flag: "🇫🇷", pages: "Pages 74–75" },
        { name: "Germany", code: "GER", flag: "🇩🇪", pages: "Pages 40–41" },
        { name: "Ghana", code: "GHA", flag: "🇬🇭", pages: "Pages 102–103" },
        { name: "Haiti", code: "HAI", flag: "🇭🇹", pages: "Pages 28–29" },
        { name: "Iran", code: "IRN", flag: "🇮🇷", pages: "Pages 62–63" },
        { name: "Iraq", code: "IRQ", flag: "🇮🇶", pages: "Pages 78–79" },
        { name: "Japan", code: "JPN", flag: "🇯🇵", pages: "Pages 50–51" },
        { name: "Jordan", code: "JOR", flag: "🇯🇴", pages: "Pages 88–89" },
        { name: "Korea Republic", code: "KOR", flag: "🇰🇷", pages: "Pages 12–13" },
        { name: "Mexico", code: "MEX", flag: "🇲🇽", pages: "Pages 8–9" },
        { name: "Morocco", code: "MAR", flag: "🇲🇦", pages: "Pages 26–27" },
        { name: "Netherlands", code: "NED", flag: "🇳🇱", pages: "Pages 48–49" },
        { name: "New Zealand", code: "NZL", flag: "🇳🇿", pages: "Pages 64–65" },
        { name: "Norway", code: "NOR", flag: "🇳🇴", pages: "Pages 80–81" },
        { name: "Panama", code: "PAN", flag: "🇵🇦", pages: "Pages 104–105" },
        { name: "Paraguay", code: "PAR", flag: "🇵🇾", pages: "Pages 34–35" },
        { name: "Portugal", code: "POR", flag: "🇵🇹", pages: "Pages 90–91" },
        { name: "Qatar", code: "QAT", flag: "🇶🇦", pages: "Pages 20–21" },
        { name: "Saudi Arabia", code: "KSA", flag: "🇸🇦", pages: "Pages 70–71" },
        { name: "Scotland", code: "SCO", flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", pages: "Pages 30–31" },
        { name: "Senegal", code: "SEN", flag: "🇸🇳", pages: "Pages 76–77" },
        { name: "South Africa", code: "RSA", flag: "🇿🇦", pages: "Pages 10–11" },
        { name: "Spain", code: "ESP", flag: "🇪🇸", pages: "Pages 66–67" },
        { name: "Sweden", code: "SWE", flag: "🇸🇪", pages: "Pages 52–53" },
        { name: "Switzerland", code: "SUI", flag: "🇨🇭", pages: "Pages 22–23" },
        { name: "Tunisia", code: "TUN", flag: "🇹🇳", pages: "Pages 54–55" },
        { name: "Türkiye", code: "TUR", flag: "🇹🇷", pages: "Pages 38–39" },
        { name: "Uruguay", code: "URU", flag: "🇺🇾", pages: "Pages 72–73" },
        { name: "United States", code: "USA", flag: "🇺🇸", pages: "Pages 32–33" },
        { name: "Uzbekistan", code: "UZB", flag: "🇺🇿", pages: "Pages 94–95" }
    ];

    // Pre-calculate page numbers for quick book sorting
    teams.forEach(t => {
        const match = t.pages.match(/Pages?\s*(\d+)/i);
        t.startPage = match ? parseInt(match[1], 10) : 999;
    });

    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results-container');
    const emptyMsg = document.getElementById('empty-msg');

    searchInput.addEventListener('input', () => {
        const rawInput = searchInput.value;
        
        if (!rawInput.trim()) {
            resultsContainer.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }

        emptyMsg.style.display = 'none';

        // Split by commas, spaces, or newlines, then clean up
        const rawTokens = rawInput.split(/[\s,]+/);
        const processedStickers = [];

        rawTokens.forEach(token => {
            const cleanToken = token.trim().toUpperCase();
            if (!cleanToken) return;

            // Separate text prefix (ISO) from numeric suffix (Sticker #)
            const match = cleanToken.match(/^([A-Z]+)(\d*)$/);
            
            if (match) {
                const textPart = match[1];
                const numPart = match[2] ? parseInt(match[2], 10) : 0;
                
                const foundTeam = teams.find(t => t.code === textPart);
                
                if (foundTeam) {
                    processedStickers.push({
                        inputCode: cleanToken,
                        team: foundTeam,
                        num: numPart,
                        isValid: true
                    });
                } else {
                    // Track unmapped/special codes (like FWC)
                    processedStickers.push({
                        inputCode: cleanToken,
                        team: { name: "Special / Unknown", flag: "🏳️", startPage: 0, pages: "Intro/End Pages" },
                        num: numPart,
                        isValid: false
                    });
                }
            }
        });

        // Sort items strictly by Book Order (Page Number first, then Sticker Number)
        processedStickers.sort((a, b) => {
            if (a.team.startPage !== b.team.startPage) {
                return a.team.startPage - b.team.startPage;
            }
            return a.num - b.num;
        });

        // Render the organized list elements
        resultsContainer.innerHTML = '';
        processedStickers.forEach(item => {
            const row = document.createElement('div');
            row.className = 'sticker-row';
            
            row.innerHTML = `
                <div class="sticker-info">
                    <span class="flag">${item.team.flag}</span>
                    <span class="sticker-code">${item.inputCode}</span>
                    <span class="country-name ${!item.isValid ? 'error-code' : ''}">${item.team.name}</span>
                </div>
                <div class="page-badge">${item.team.pages}</div>
            `;
            resultsContainer.appendChild(row);
        });
    });
</script>
</body>
</html>
