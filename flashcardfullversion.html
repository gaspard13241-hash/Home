<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étude | Minimalist Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flipped { transform: rotateY(180deg); }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-[#F9F9FB] text-[#1D1D1F]">

<div x-data="app()" x-init="init()" class="max-w-xl mx-auto min-h-screen flex flex-col px-6 py-12">
    
    <!-- Header Minimaliste -->
    <header class="flex justify-between items-center mb-12">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">Étude</h1>
            <p class="text-sm text-slate-400" x-text="mode === 'flash' ? 'Mode Flashcards' : 'Mode Vrai/Faux'"></p>
        </div>
        <div class="flex space-x-2">
            <button @click="toggleMode" class="text-xs font-medium px-4 py-2 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition">
                Changer de mode
            </button>
            <input type="file" accept=".csv" @change="handleFileUpload" id="fileInput" class="hidden">
            <label for="fileInput" class="inline-block px-4 py-2 bg-white border border-slate-200 text-xs font-medium rounded-full cursor-pointer hover:bg-slate-50 transition">
                Importer CSV
            </label>
        </div>
    </header>

    <!-- Interface d'apprentissage -->
    <div class="flex-1 flex flex-col">
        
        <!-- Barre de progression discrète -->
        <div class="w-full bg-slate-200 h-1 rounded-full mb-12 overflow-hidden">
            <div class="bg-indigo-500 h-full transition-all duration-500" :style="`width: ${((currentIndex + 1) / cards.length) * 100}%`"></div>
        </div>

        <!-- MODE FLASHCARDS -->
        <div x-show="mode === 'flash'" class="flex-1">
            <div class="relative h-80 w-full cursor-pointer group" @click="isFlipped = !isFlipped">
                <div class="card-inner w-full h-full relative" :class="isFlipped ? 'flipped' : ''">
                    <!-- Recto -->
                    <div class="backface-hidden absolute inset-0 bg-white border border-slate-100 rounded-[2rem] shadow-sm flex items-center justify-center p-8 text-center">
                        <p class="text-xl font-light leading-relaxed" x-text="cards[currentIndex].question"></p>
                    </div>
                    <!-- Verso -->
                    <div class="backface-hidden rotate-y-180 absolute inset-0 bg-indigo-600 text-white rounded-[2rem] shadow-lg flex items-center justify-center p-8 text-center">
                        <p class="text-xl font-light leading-relaxed" x-text="cards[currentIndex].reponse"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODE VRAI / FAUX -->
        <div x-show="mode === 'quiz'" class="flex-1 flex flex-col">
            <div class="bg-white border border-slate-100 rounded-[2rem] p-10 shadow-sm mb-8 flex-1 flex flex-col justify-center text-center">
                <span class="text-[10px] uppercase tracking-[0.2em] text-slate-400 mb-4 block">Est-ce correct ?</span>
                <p class="text-lg font-medium mb-4" x-text="cards[currentIndex].question"></p>
                <div class="h-px w-8 bg-slate-100 mx-auto mb-4"></div>
                <p class="text-2xl text-indigo-600 font-light" x-text="quizProposition"></p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button @click="checkAnswer(false)" class="py-4 rounded-2xl border border-slate-200 font-medium hover:bg-red-50 hover:border-red-100 hover:text-red-600 transition">Faux</button>
                <button @click="checkAnswer(true)" class="py-4 rounded-2xl border border-slate-200 font-medium hover:bg-green-50 hover:border-green-100 hover:text-green-600 transition">Vrai</button>
            </div>
            
            <div x-show="feedback" 
                 :class="feedback === 'correct' ? 'text-green-500' : 'text-red-500'"
                 class="text-center text-sm font-medium mb-4 animate-bounce" 
                 x-text="feedback === 'correct' ? 'Bien joué !' : 'Oups, mauvaise réponse'">
            </div>
        </div>

        <!-- Navigation Bas de page -->
        <footer class="flex items-center justify-between mt-auto pt-8">
            <button @click="prevCard" class="p-3 text-slate-400 hover:text-indigo-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <span class="text-xs font-medium text-slate-400 tracking-widest" x-text="`${currentIndex + 1} / ${cards.length}`"></span>
            <button @click="nextCard" class="p-3 text-slate-400 hover:text-indigo-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
        </footer>
    </div>
</div>

<script>
    function app() {
        return {
            cards: [],
            currentIndex: 0,
            isFlipped: false,
            mode: 'flash', // 'flash' ou 'quiz'
            quizProposition: '',
            isCorrectProposition: true,
            feedback: null,

            // Initialize with all the flashcards
            init() {
                this.cards = [
                    // Physique chimie cards
                    { question: "Définition : Système (en physique)", reponse: "C'est l'objet spécifique que l'on étudie." },
                    { question: "Qu'est-ce qu'un référentiel en cinématique ?", reponse: "C'est le point de vue choisi pour étudier le mouvement d'un objet." },
                    { question: "Un mouvement est dit _____ car il dépend du référentiel choisi.", reponse: "relatif" },
                    { question: "Quel référentiel a pour origine le centre de la Terre ?", reponse: "Le référentiel géocentrique." },
                    { question: "Quel référentiel a pour origine le centre du Soleil ?", reponse: "Le référentiel héliocentrique." },
                    { question: "Comment qualifie-t-on la trajectoire d'un objet qui se déplace en ligne droite ?", reponse: "Une trajectoire rectiligne." },
                    { question: "Comment qualifie-t-on la trajectoire d'un objet qui se déplace selon un cercle ?", reponse: "Une trajectoire circulaire." },
                    { question: "Trajectoire : Courbe quelconque", reponse: "Mouvement curviligne" },
                    { question: "Si la vitesse d'un objet est constante, comment qualifie-t-on son mouvement ?", reponse: "Un mouvement uniforme." },
                    { question: "Mouvement accéléré", reponse: "La vitesse de l'objet augmente au cours du temps." },
                    { question: "Mouvement ralenti", reponse: "La vitesse de l'objet diminue au cours du temps." },
                    { question: "Formule : Vitesse moyenne (v)", reponse: "v = d / Δt" },
                    { question: "Dans la formule v = d / Δt, que représente la notation Δt ?", reponse: "La durée (ou intervalle de temps) du parcours." },
                    { question: "Une action mécanique se modélise par une _____.", reponse: "force" },
                    { question: "Quelles sont les 4 caractéristiques qui définissent une force ?", reponse: "La direction, le sens, l'intensité et le point d'application." },
                    { question: "Quelle est l'unité de l'intensité d'une force ?", reponse: "Le Newton (symbole N)." },
                    { question: "Quel instrument utilise-t-on pour mesurer l'intensité d'une force ?", reponse: "Un dynamomètre." },
                    { question: "Où se situe le point d'application d'une force pour une action à distance ?", reponse: "Au centre de gravité de l'objet." },
                    { question: "Dans un Diagramme Objet-Interaction (DOI), que représente une flèche ?", reponse: "Une interaction entre deux objets." },
                    { question: "Conditions pour qu'un système à deux forces soit à l'équilibre ?", reponse: "Même direction et même intensité, mais des sens opposés." },
                    { question: "Si un système à l'équilibre est en mouvement, quel est son type de mouvement ?", reponse: "Un mouvement rectiligne uniforme." },
                    { question: "État de la matière : Solide", reponse: "Molécules liées et immobiles ; forme propre et incompressible." },
                    { question: "État de la matière : Liquide", reponse: "Molécules peu liées et mobiles ; coule et épouse la forme." },
                    { question: "État de la matière : Gaz", reponse: "Molécules très espacées et agitées ; compressible et expansible." },
                    { question: "Lors d'un changement d'état, la _____ se conserve.", reponse: "masse" },
                    { question: "Pourquoi le volume peut-il varier lors d'un changement d'état ?", reponse: "Parce que les espaces vides entre les molécules changent." },
                    { question: "Définition : Corps pur", reponse: "Substance composée d'une seule sorte de molécules." },
                    { question: "Définition : Mélange", reponse: "Substance composée de plusieurs sortes de molécules." },
                    { question: "Comment appelle-t-on le passage de l'état solide à l'état liquide ?", reponse: "La fusion." },
                    { question: "Comment appelle-t-on le passage de l'état liquide à l'état gazeux ?", reponse: "La vaporisation." },
                    { question: "Comment appelle-t-on le passage de l'état gazeux à l'état liquide ?", reponse: "La liquéfaction." },
                    { question: "Comment appelle-t-on le passage de l'état liquide à l'état solide ?", reponse: "La solidification." },
                    { question: "Comment appelle-t-on le passage direct de l'état solide à l'état gazeux ?", reponse: "La sublimation." },
                    { question: "Comment appelle-t-on le passage direct de l'état gazeux à l'état solide ?", reponse: "La condensation." },
                    { question: "Formule : Masse volumique (ρ)", reponse: "ρ = m / V" },
                    { question: "Sur une courbe de température, qu'indique un palier ?", reponse: "La présence d'un corps pur." },
                    { question: "Quelle est la valeur du pH pour une solution neutre ?", reponse: "pH = 7" },
                    { question: "Une solution est dite acide si son pH est _____.", reponse: "inférieur à 7 (pH < 7)" },
                    { question: "Une solution est dite basique si son pH est _____.", reponse: "supérieur à 7 (pH > 7)" },
                    { question: "Constituants principaux de l'air et proportions volumiques ?", reponse: "Diazote (N2) à 80% et Dioxygène (O2) à 20%." },
                    { question: "Proportion simplifiée (fraction) du diazote dans l'air ?", reponse: "4/5 du volume." },
                    { question: "Proportion simplifiée (fraction) du dioxygène dans l'air ?", reponse: "1/5 du volume." },
                    { question: "Valeur de la masse volumique de l'air (conditions normales) ?", reponse: "1,3 g/L" },
                    { question: "Citez une source de méthane (CH4) dans l'atmosphère.", reponse: "L'agriculture ou la décomposition." },
                    { question: "Source principale de dioxyde de carbone (CO2) humaine ?", reponse: "La combustion." },
                    { question: "Différence entre transformation physique et chimique ?", reponse: "Physique : molécules conservées ; Chimique : molécules changent." },
                    { question: "Vrai ou Faux : La masse se conserve lors d'une transformation chimique.", reponse: "Vrai." },
                    { question: "Dans un mélange, les molécules se _____.", reponse: "conservent" },
                    { question: "Comment appelle-t-on les substances qui réagissent au début ?", reponse: "Les réactifs." },
                    { question: "Comment appelle-t-on la nouvelle substance formée à la fin ?", reponse: "Le produit." },
                    { question: "Concept : Molécule", reponse: "Particule invisible, indéformable, de dimensions et masse constantes." },

                    // SVT cards
                    { question: "Dans la nutrition des végétaux, quel tissu assure le transport de la sève brute ?", reponse: "Le xylème." },
                    { question: "Quel est le rôle du phloème chez les plantes ?", reponse: "Transporter la sève élaborée." },
                    { question: "Complétez l'équation de la photosynthèse : CO2 + H2O → _____ + O2.", reponse: "Matière organique" },
                    { question: "Dans une symbiose végétale, que fournit la plante à son partenaire ?", reponse: "De la matière organique." },
                    { question: "Dans une symbiose, quel élément le partenaire fournit-il à la plante ?", reponse: "De l'eau et des sels minéraux." },
                    { question: "Quelle zone de la racine est responsable de l'absorption de l'eau et des sels minéraux ?", reponse: "La zone pilifère (poils absorbants)." },
                    { question: "Comment appelle-t-on les cellules de la reproduction sexuée ?", reponse: "Les gamètes." },
                    { question: "Quelle pièce florale porte le pollen contenant les cellules reproductrices mâles ?", reponse: "Les étamines." },
                    { question: "Quelle partie de la fleur contient les ovules ?", reponse: "Le pistil." },
                    { question: "Comment appelle-t-on le transport du grain de pollen jusqu'au pistil ?", reponse: "La pollinisation." },
                    { question: "Quelle structure permet aux gamètes mâles de rejoindre les ovules après la germination du pollen ?", reponse: "Le tube pollinique." },
                    { question: "La fusion du gamète mâle et du gamète femelle s'appelle la _____.", reponse: "fécondation" },
                    { question: "Suite à la fécondation, en quoi l'ovule se transforme-t-il ?", reponse: "En graine." },
                    { question: "Suite à la fécondation, en quoi le pistil se transforme-t-il ?", reponse: "En fruit." },
                    { question: "Quels sont les trois principaux agents de transport des graines et des fruits ?", reponse: "L'eau, les animaux et le vent." },
                    { question: "Comment appelle-t-on l'étape où la graine redonne un nouvel individu ?", reponse: "La germination." },
                    { question: "Quel est le nom scientifique de la reproduction sans graines ni gamètes ?", reponse: "La reproduction asexuée (ou multiplication végétative)." },
                    { question: "Comment les lentilles d'eau se multiplient-elles de manière asexuée ?", reponse: "Par bourgeonnement." },
                    { question: "Par quel processus les végétaux unicellulaires se multiplient-ils ?", reponse: "Par division cellulaire (en deux)." },
                    { question: "Citez deux exemples d'organes spécialisés permettant la multiplication végétative naturelle.", reponse: "Les stolons et les rhizomes (ou bulbes/tubercules)." },
                    { question: "Vrai ou Faux : La reproduction asexuée peut se faire à partir d'une seule cellule.", reponse: "Vrai." },
                    { question: "Nommez une technique de multiplication végétative réalisée par l'intervention de l'homme.", reponse: "Le bouturage (ou marcottage/greffage)." },
                    { question: "Quelles substances chimiques facilitent la rencontre des partenaires chez certaines espèces animales ?", reponse: "Les phéromones." },
                    { question: "Comment appelle-t-on l'acte qui favorise la rencontre des gamètes chez beaucoup d'animaux ?", reponse: "L'accouplement." },
                    { question: "Où se déroule la fécondation interne ?", reponse: "À l'intérieur de l'organisme femelle." },
                    { question: "Dans quel milieu de vie rencontre-t-on majoritairement la fécondation externe ?", reponse: "En milieu aquatique." },
                    { question: "Comment la rencontre des gamètes est-elle favorisée lors d'une fécondation externe ?", reponse: "Par la libération d'un nombre élevé de gamètes." },
                    { question: "Comment appelle-t-on une espèce dont l'embryon se développe dans un œuf à l'extérieur de la mère ?", reponse: "Ovipare." },
                    { question: "Définition : Viviparité", reponse: "Mode de développement où l'embryon se développe dans l'organisme maternel qui assure sa nutrition." },
                    { question: "Qu'est-ce que la dynamique des populations ?", reponse: "La variation du nombre d'individus d'une espèce dans un milieu au cours du temps." },
                    { question: "Quel type de reproduction est privilégié quand les conditions du milieu sont défavorables ?", reponse: "La reproduction sexuée." },
                    { question: "Pourquoi la reproduction asexuée permet-elle une invasion rapide d'un milieu ?", reponse: "Car elle produit des individus identiques très nombreux quand les conditions sont favorables." },
                    { question: "Quel est l'avantage biologique de la reproduction sexuée lors d'un changement de milieu ?", reponse: "Elle crée une diversité d'individus, augmentant les chances de survie." },
                    { question: "Comment la disponibilité en nourriture influence-t-elle la population ?", reponse: "Elle influe sur la fécondité (nombre de jeunes) et la survie des individus." },
                    { question: "Citez deux facteurs physiques du milieu influençant la reproduction animale ou végétale.", reponse: "La température et l'oxygénation de l'eau." },
                    { question: "Quel facteur biologique peut provoquer une diminution de l'effectif d'une population ?", reponse: "La présence de prédateurs." },
                    { question: "Les individus issus d'une reproduction asexuée sont _____ entre eux.", reponse: "identiques" },
                    { question: "Quelle partie de l'étamine contient précisément les grains de pollen ?", reponse: "L'anthère." },
                    { question: "Comment appelle-t-on la tige qui supporte l'anthère dans une étamine ?", reponse: "Le filet." },
                    { question: "Au sommet du pistil, quelle partie reçoit le pollen ?", reponse: "Le stigmate." },
                    { question: "Dans le pistil, quelle partie relie le stigmate à l'ovaire ?", reponse: "Le style." },
                    { question: "Quel organe de la fleur produit du nectar pour attirer les animaux pollinisateurs ?", reponse: "Le nectaire." },
                    { question: "Concept : Dissémination", reponse: "Le transport des graines ou des fruits à distance de la plante mère pour coloniser de nouveaux milieux." },
                    { question: "Quel est le résultat immédiat de la division d'une cellule-œuf ?", reponse: "Un embryon." },
                    { question: "Pourquoi la reproduction sexuée assure-t-elle le maintien dans un milieu changeant ?", reponse: "Grâce à la diversité génétique des individus produits." },
                    { question: "La sève brute est composée d'eau et de _____.", reponse: "sels minéraux" },
                    { question: "Où se déroule principalement la photosynthèse dans une plante ?", reponse: "Dans les feuilles (parties vertes)." },
                    { question: "Quel gaz est rejeté par les végétaux lors de la photosynthèse ?", reponse: "Le dioxygène (O2)." },
                    { question: "Quel gaz est absorbé par les feuilles pour la photosynthèse ?", reponse: "Le dioxyde de carbone (CO2)." },
                    { question: "La sève élaborée est riche en _____.", reponse: "matière organique" },
                    { question: "Comment appelle-t-on les plantes à tiges rampantes permettant la reproduction asexuée ?", reponse: "Les plantes à stolons." },
                    { question: "Le rhizome est une tige _____ permettant la multiplication végétative.", reponse: "souterraine" },
                    { question: "Quel type de fécondation produit généralement un nombre d'individus moins important ?", reponse: "La fécondation interne." },
                    { question: "Vrai ou Faux : Les conditions du milieu peuvent déterminer quel type de reproduction une espèce va privilégier.", reponse: "Vrai." },
                    { question: "Qu'arrive-t-il à l'effectif d'une population si les conditions de survie et de reproduction sont optimales ?", reponse: "L'effectif augmente." },
                    { question: "Dans le schéma d'une fleur, comment appelle-t-on les pièces protectrices souvent vertes à la base ?", reponse: "Les sépales." },
                    { question: "Dans le schéma d'une fleur, comment appelle-t-on les pièces colorées qui entourent les organes reproducteurs ?", reponse: "Les pétales." },
                    { question: "Quelle est la différence fondamentale entre fécondation et pollinisation ?", reponse: "La pollinisation est le transport du pollen, la fécondation est la fusion des gamètes." },
                    { question: "Chez les animaux, que signifie une libération 'synchronisée' des gamètes ?", reponse: "Les mâles et les femelles libèrent leurs gamètes en même temps." },
                    { question: "Quel est l'impact des températures extrêmes sur l'effectif d'une population ?", reponse: "Elles peuvent causer la disparition d'individus et faire diminuer l'effectif." },
                    { question: "Le _____ est une technique humaine consistant à enterrer une partie d'une tige pour qu'elle s'enracine.", reponse: "marcottage" },
                    { question: "Comment appelle-t-on les petites bulbilles qui se détachent pour former une nouvelle plante ?", reponse: "Des bulbilles." },
                    { question: "Quelle source d'énergie est indispensable à la photosynthèse ?", reponse: "L'énergie lumineuse." },
                    { question: "Que devient la cellule-œuf après plusieurs divisions ?", reponse: "Un embryon." },
                    { question: "La _____ est le nombre de jeunes qui naissent dans une population.", reponse: "fécondité" },
                    { question: "Parmi les rhizomes, stolons et tubercules, lequel est une tige aérienne rampante ?", reponse: "Le stolon." },
                    { question: "Dans quel organe de la fleur se trouve la cellule reproductrice femelle ?", reponse: "L'ovule." },
                    { question: "La reproduction _____ ne nécessite qu'un seul parent.", reponse: "asexuée" },
                    { question: "Quel est l'avantage de la reproduction asexuée en milieu stable ?", reponse: "Elle permet une colonisation très rapide et efficace du milieu." },
                    { question: "Pourquoi l'embryon est-il considéré comme vulnérable ?", reponse: "Car il est en cours de développement et nécessite protection et nutrition." },
                    { question: "Quel facteur du milieu aquatique est crucial pour la survie des poissons ?", reponse: "L'oxygénation de l'eau." },
                    { question: "Le _____ consiste à implanter un fragment de plante sur une autre plante pour qu'ils s'unissent.", reponse: "greffage" },
                    { question: "Quel est le devenir d'une graine si elle tombe dans un milieu favorable ?", reponse: "Elle germe pour donner une nouvelle plante." },
                    { question: "En milieu aérien, la rencontre des gamètes nécessite généralement un _____.", reponse: "accouplement" },
                    { question: "Vrai ou Faux : La reproduction asexuée produit une grande diversité génétique.", reponse: "Faux." },

                    // Technologie cards
                    { question: "Par quoi commence obligatoirement toute formule dans un tableur ?", reponse: "Le signe égale (=)." },
                    { question: "Dans un tableur, comment repère-t-on une cellule ?", reponse: "Par ses coordonnées (lettre de colonne et numéro de ligne)." },
                    { question: "Quel opérateur est utilisé pour effectuer une multiplication dans un tableur ?", reponse: "L'astérisque (*)." },
                    { question: "Quel opérateur est utilisé pour effectuer une division dans un tableur ?", reponse: "La barre oblique (/)." },
                    { question: "Quelle fonction permet d'additionner automatiquement les valeurs des cellules A1 à A10 ?", reponse: """=SOMME(A1:A10)""" },
                    { question: "Quelle fonction permet de calculer la valeur centrale d'une série de données de B2 à B20 ?", reponse: """=MOYENNE(B2:B20)""" },
                    { question: "En programmation, quel est le rôle d'une boucle (répéter) ?", reponse: "Exécuter plusieurs fois la même suite d'instructions." },
                    { question: "Comment appelle-t-on les instructions de type « Si... Alors... Sinon » ?", reponse: "Des structures ou instructions conditionnelles." },
                    { question: "Qu'est-ce qu'une variable en algorithmique ?", reponse: "Une valeur stockée qui peut être modifiée par le programme." },
                    { question: "Définition : Objet technique", reponse: "Objet fabriqué par l'être humain pour répondre à un besoin." },
                    { question: "Qu'est-ce qu'un Système Technique (OST) ?", reponse: "Un ensemble d'objets techniques fonctionnant ensemble pour rendre un service." },
                    { question: "À quelle question précise répond le « besoin » d'un objet ?", reponse: "La question « Pourquoi ? »." },
                    { question: "Par quel type de mot doit commencer la formulation d'un besoin ?", reponse: "Un verbe à l'infinitif." },
                    { question: "Que désigne l'acronyme « UX » ?", reponse: "L'expérience utilisateur (User eXperience)." },
                    { question: "Qu'est-ce que le cycle de vie d'un objet technique ?", reponse: "L'ensemble des étapes de sa création jusqu'à son élimination." },
                    { question: "Définition : Matières premières", reponse: "Ressources naturelles utilisées pour fabriquer un objet (ex: pétrole, fer)." },

                    { question: "Quel mode verbal est utilisé pour l'hypothèse ou une demande polie ?", reponse: "Le conditionnel." },
                    { question: "Quel mode verbal sert à donner un ordre ou un conseil ?", reponse: "L'impératif." },
                    { question: "Formation : Quel mode impersonnel se forme avec 'En + participe présent' ?", reponse: "Le gérondif." },
                    { question: "Dans l'analyse d'un verbe, quels sont les 4 éléments à préciser ?", reponse: "Le mode, le temps, la personne et la valeur." },
                    { question: "Quelle est la terminaison de la 3e personne du pluriel à l'imparfait pour tous les verbes ?", reponse: "-aient." },
                    { question: "À quel temps appartient la terminaison '-âmes' ou '-îmes' (ex: nous marchâmes) ?", reponse: "Au passé simple." },
                    { question: "Comment appelle-t-on le rapprochement de mots aux sonorités proches (ex: 'Qui se ressemble s'assemble') ?", reponse: "La paronomase." },
                    { question: "Figure de style : Une énumération de termes organisée de façon croissante ou décroissante.", reponse: "La gradation." },
                    { question: "Homophone : 'mon' vs 'm'ont'", reponse: "'mon' est un adjectif possessif, 'm'ont' est le pronom 'me' suivi du verbe avoir." },
                    { question: "Homophone : 'si' vs 's'y'", reponse: "'si' est une conjonction ou un adverbe, 's'y' est le pronom 'se' suivi de 'y' devant un verbe." },
                    { question: "Homophone : 'sans' vs 's'en'", reponse: "'sans' indique le manque, 's'en' est le pronom 'se' suivi de 'en' devant un verbe." },
                    { question: "Qu'est-ce qu'une question rhétorique ?", reponse: "Une affirmation déguisée sous forme de question qui n'attend pas de réponse." },
                    { question: "Quelle figure de style consiste à dire le contraire de ce que l'on pense par ironie ?", reponse: "L'antiphrase." },
                    { question: "Dans 'La Parure', quelle est la révélation finale (la chute) ?", reponse: "La parure prêtée par Mme Forestier était fausse et ne valait presque rien." },
                    { question: "Pourquoi le fils Tuvache renie-t-il ses parents à la fin de 'Aux champs' ?", reponse: "Parce qu'ils ne l'ont pas vendu aux d'Hubières, le privant ainsi d'une vie riche." },
                    { question: "Comment appelle-t-on une métaphore ou comparaison devenue banale (ex: 'un cœur de pierre') ?", reponse: "Un cliché." },
                    { question: "Quelle est la particularité du radical de l'imparfait ?", reponse: "Il se base sur la 1re personne du pluriel du présent (nous)." }
                ];
                this.prepareQuiz();
            },

            handleFileUpload(event) {
                const file = event.target.files[0];
                Papa.parse(file, {
                    header: false, // Assuming CSVs do not have a header row
                    skipEmptyLines: true,
                    complete: (results) => {
                        // PapaParse results.data will be an array of arrays if header: false
                        // Each inner array is a row, e.g., ["Question", "Answer"]
                        this.cards = results.data.map(row => ({
                            question: row[0],
                            reponse: row[1]
                        }));
                        this.currentIndex = 0; // Reset index for new cards
                        this.prepareQuiz();
                    }
                });
            },

            toggleMode() {
                this.mode = this.mode === 'flash' ? 'quiz' : 'flash';
                this.feedback = null;
                this.prepareQuiz();
            },

            prepareQuiz() {
                if (this.cards.length === 0) return;
                this.isFlipped = false;
                this.feedback = null;
                
                // 50% chance to show the correct answer, 50% a random wrong one
                this.isCorrectProposition = Math.random() > 0.5;
                if (this.isCorrectProposition) {
                    this.quizProposition = this.cards[this.currentIndex].reponse;
                } else {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * this.cards.length);
                    } while (randomIndex === this.currentIndex && this.cards.length > 1); // Ensure different card if possible
                    this.quizProposition = this.cards[randomIndex].reponse;
                }
            },

            checkAnswer(userChoice) {
                if (userChoice === this.isCorrectProposition) {
                    this.feedback = 'correct';
                    setTimeout(() => this.nextCard(), 800);
                } else {
                    this.feedback = 'wrong';
                }
            },

            nextCard() {
                this.feedback = null; // Clear feedback before moving
                if (this.currentIndex < this.cards.length - 1) {
                    this.currentIndex++;
                } else {
                    this.currentIndex = 0; // Loop back to the beginning
                }
                this.prepareQuiz();
            },

            prevCard() {
                this.feedback = null; // Clear feedback before moving
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                } else {
                    this.currentIndex = this.cards.length - 1; // Loop to the end
                }
                this.prepareQuiz();
            }
        }
    }
</script>
