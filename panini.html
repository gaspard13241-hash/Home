<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panini World Cup 2026 Page Finder</title>
    <style>
        :root {
            --primary-color: #8a1538;
            --secondary-color: #eeeee4;
            --text-color: #333333;
            --accent-color: #da291c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-top: 8px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 24px;
        }

        h2 {
            font-size: 14px;
            color: #666;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .result-card {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flag {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
        }

        .country-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .iso-code {
            font-size: 14px;
            color: #777;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .page-badge {
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(138, 21, 56, 0.3);
        }

        .no-result {
            color: #999;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 World Cup 2026 ⚽</h1>
    <h2>Panini Album Page Finder</h2>
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Type country name or ISO code..." autocomplete="off" autofocus>
    </div>

    <div id="result" class="result-card">
        <span id="res-flag" class="flag"></span>
        <div id="res-name" class="country-name"></div>
        <div id="res-code" class="iso-code"></div>
        <div id="res-pages" class="page-badge"></div>
    </div>
    
    <div id="empty-msg" class="no-result">Start typing to find album pages</div>
</div>

<script>
    // Systematically loaded master dataset from the album index
    const teams = [
        { name: "Algeria", code: "ALG", flag: " Algeria 🇩🇿", pages: "Pages 84–85" },
        { name: "Argentina", code: "ARG", flag: "🇦🇷", pages: "Pages 82–83" },
        { name: "Australia", code: "AUS", flag: "🇦🇺", pages: "Pages 36–37" },
        { name: "Austria", code: "AUT", flag: "🇦🇹", pages: "Pages 86–87" },
        { name: "Belgium", code: "BEL", flag: "🇧🇪", pages: "Pages 58–59" },
        { name: "Bosnia-Herzegovina", code: "BIH", flag: "🇧🇦", pages: "Pages 18–19" },
        { name: "Brazil", code: "BRA", flag: "🇧🇷", pages: "Pages 24–25" },
        { name: "Cabo Verde", code: "CPV", flag: "🇨🇻", pages: "Pages 68–69" },
        { name: "Canada", code: "CAN", flag: "🇨🇦", pages: "Pages 16–17" },
        { name: "Colombia", code: "COL", flag: "🇨🇴", pages: "Pages 96–97" },
        { name: "Congo DR", code: "COD", flag: "🇨🇩", pages: "Pages 92–93" },
        { name: "Croatia", code: "CRO", flag: "🇭🇷", pages: "Pages 100–101" },
        { name: "Curaçao", code: "CUW", flag: "🇨🇼", pages: "Pages 42–43" },
        { name: "Czechia", code: "CZE", flag: "🇨🇿", pages: "Pages 14–15" },
        { name: "Côte d'Ivoire", code: "CIV", flag: "🇨🇮", pages: "Pages 44–45" },
        { name: "Ecuador", code: "ECU", flag: "🇪🇨", pages: "Pages 46–47" },
        { name: "Egypt", code: "EGV", flag: "🇪🇬", pages: "Pages 60–61" },
        { name: "England", code: "ENG", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", pages: "Pages 98–99" },
        { name: "France", code: "FRA", flag: "🇫🇷", pages: "Pages 74–75" },
        { name: "Germany", code: "GER", flag: "🇩🇪", pages: "Pages 40–41" },
        { name: "Ghana", code: "GHA", flag: "🇬🇭", pages: "Pages 102–103" },
        { name: "Haiti", code: "HAI", flag: "🇭🇹", pages: "Pages 28–29" },
        { name: "Iran", code: "IRN", flag: "🇮🇷", pages: "Pages 62–63" },
        { name: "Iraq", code: "IRQ", flag: "🇮🇶", pages: "Pages 78–79" },
        { name: "Japan", code: "JPN", flag: "🇯🇵", pages: "Pages 50–51" },
        { name: "Jordan", code: "JOR", flag: "🇯🇴", pages: "Pages 88–89" },
        { name: "Korea Republic", code: "KOR", flag: "🇰🇷", pages: "Pages 12–13" },
        { name: "Mexico", code: "MEX", flag: "🇲🇽", pages: "Pages 8–9" },
        { name: "Morocco", code: "MAR", flag: "🇲🇦", pages: "Pages 26–27" },
        { name: "Netherlands", code: "NED", flag: "🇳🇱", pages: "Pages 48–49" },
        { name: "New Zealand", code: "NZL", flag: "🇳🇿", pages: "Pages 64–65" },
        { name: "Norway", code: "NOR", flag: "🇳🇴", pages: "Pages 80–81" },
        { name: "Panama", code: "PAN", flag: "🇵🇦", pages: "Pages 104–105" },
        { name: "Paraguay", code: "PAR", flag: "🇵🇾", pages: "Pages 34–35" },
        { name: "Portugal", code: "POR", flag: "🇵🇹", pages: "Pages 90–91" },
        { name: "Qatar", code: "QAT", flag: "🇶🇦", pages: "Pages 20–21" },
        { name: "Saudi Arabia", code: "KSA", flag: "🇸🇦", pages: "Pages 70–71" },
        { name: "Scotland", code: "SCO", flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", pages: "Pages 30–31" },
        { name: "Senegal", code: "SEN", flag: "🇸🇳", pages: "Pages 76–77" },
        { name: "South Africa", code: "RSA", flag: "🇿🇦", pages: "Pages 10–11" },
        { name: "Spain", code: "ESP", flag: "🇪🇸", pages: "Pages 66–67" },
        { name: "Sweden", code: "SWE", flag: "🇸🇪", pages: "Pages 52–53" },
        { name: "Switzerland", code: "SUI", flag: "🇨🇭", pages: "Pages 22–23" },
        { name: "Tunisia", code: "TUN", flag: "🇹🇳", pages: "Pages 54–55" },
        { name: "Türkiye", code: "TUR", flag: "🇹🇷", pages: "Pages 38–39" },
        { name: "Uruguay", code: "URU", flag: "🇺🇾", pages: "Pages 72–73" },
        { name: "United States", code: "USA", flag: "🇺🇸", pages: "Pages 32–33" },
        { name: "Uzbekistan", code: "UZB", flag: "🇺🇿", pages: "Pages 94–95" }
    ];

    const searchInput = document.getElementById('search-input');
    const resultCard = document.getElementById('result');
    const emptyMsg = document.getElementById('empty-msg');

    const resFlag = document.getElementById('res-flag');
    const resName = document.getElementById('res-name');
    const resCode = document.getElementById('res-code');
    const resPages = document.getElementById('res-pages');

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();

        if (query === "") {
            resultCard.style.display = "none";
            emptyMsg.style.display = "block";
            emptyMsg.textContent = "Start typing to find album pages";
            return;
        }

        // Search matches either starting characters of the name or exact/partial ISO string
        const match = teams.find(team => 
            team.name.toLowerCase().includes(query) || 
            team.code.toLowerCase() === query ||
            team.code.toLowerCase().includes(query)
        );

        if (match) {
            resFlag.textContent = match.flag;
            resName.textContent = match.name;
            resCode.textContent = `ISO CODE: ${match.code}`;
            resPages.textContent = match.pages;
            
            emptyMsg.style.display = "none";
            resultCard.style.display = "block";
        } else {
            resultCard.style.display = "none";
            emptyMsg.style.display = "block";
            emptyMsg.textContent = "No team found matching that search term.";
        }
    });
</script>

</body>
</html>
