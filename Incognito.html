<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕶️ Incognito Explorer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 0.5rem;
      border-bottom: 2px solid #2b2b2b;
    }

    header button {
      background: #2a2a2a;
      border: none;
      border-radius: 4px;
      color: #fff;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    header button:hover {
      background: #444;
    }

    header input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: none;
      border-radius: 5px;
      background: #202020;
      color: #fff;
      font-size: 1rem;
    }

    nav {
      background: #141414;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      padding: 0.6rem;
      border-bottom: 1px solid #2b2b2b;
    }

    nav .link {
      background: #1b1b1b;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.2s ease, background 0.3s ease;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }

    nav .link:hover {
      transform: translateY(-4px);
      background: #222;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    footer {
      background: #111;
      text-align: center;
      color: #888;
      padding: 0.6rem;
      font-size: 0.9rem;
      border-top: 1px solid #2b2b2b;
    }

    /* Fullscreen hide UI elements */
    .fullscreen header,
    .fullscreen nav,
    .fullscreen footer {
      display: none;
    }

    @media (max-width: 600px) {
      header {
        flex-wrap: wrap;
      }
      header input {
        order: 3;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <button onclick="goBack()">⬅️</button>
    <button onclick="goForward()">➡️</button>
    <input type="text" id="address" placeholder="Enter a URL or search term..." onkeydown="if(event.key==='Enter') loadAddress()">
    <button onclick="loadAddress()">Go</button>
    <button onclick="toggleFullscreen()">🖥️ Fullscreen</button>
  </header>

  <nav>
    <div class="link" onclick="openSite('https://www.google.com')">Google</div>
    <div class="link" onclick="openSite('https://www.youtube.com')">YouTube</div>
    <div class="link" onclick="openSite('https://www.wikipedia.org')">Wikipedia</div>
    <div class="link" onclick="openSite('https://hole-io.com/')">Hole.io</div>
    <div class="link" onclick="openSite('https://paper-io.com/')">Paper.io</div>
    <div class="link" onclick="openSite('https://warbrokers.io/')">Warfront</div>
    <div class="link" onclick="openSite('https://www.reddit.com')">Reddit</div>
    <div class="link" onclick="openSite('https://twitter.com')">Twitter (X)</div>
  </nav>

  <iframe id="browserFrame" src="https://www.google.com"></iframe>

  <footer>© 2025 Gaspard | Built with 💡 and a lot of curiosity.</footer>

  <script>
    const frame = document.getElementById('browserFrame');
    const addr = document.getElementById('address');
    const historyStack = [];
    let currentIndex = -1;

    function openSite(url) {
      frame.src = url;
      addr.value = url;
      addToHistory(url);
    }

    function loadAddress() {
      let input = addr.value.trim();
      if (!input) return;
      if (!input.startsWith("http")) {
        input = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
      }
      openSite(input);
    }

    function addToHistory(url) {
      historyStack.push(url);
      currentIndex = historyStack.length - 1;
    }

    function goBack() {
      if (currentIndex > 0) {
        currentIndex--;
        frame.src = historyStack[currentIndex];
        addr.value = historyStack[currentIndex];
      }
    }

    function goForward() {
      if (currentIndex < historyStack.length - 1) {
        currentIndex++;
        frame.src = historyStack[currentIndex];
        addr.value = historyStack[currentIndex];
      }
    }

    // Fullscreen toggle — hides header, nav, and footer
    function toggleFullscreen() {
      document.body.classList.toggle('fullscreen');
      const element = document.documentElement;

      if (!document.fullscreenElement) {
        if (element.requestFullscreen) element.requestFullscreen();
        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
        else if (element.msRequestFullscreen) element.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }

    // Exit fullscreen resets UI
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('fullscreen');
      }
    });
  </script>
</body>
</html>
