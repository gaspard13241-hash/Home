<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incognito Access Portal</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: radial-gradient(circle at top, #1e1e1e, #0d0d0d);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 1.5rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.3rem;
    }

    header p {
      color: #ccc;
    }

    .browser {
      width: 95%;
      max-width: 1000px;
      background: #141414;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .toolbar {
      background: #2b2b2b;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .toolbar button {
      background: #3d3d3d;
      border: none;
      border-radius: 5px;
      color: #fff;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toolbar button:hover {
      background: #555;
    }

    .toolbar input {
      flex: 1;
      padding: 0.5rem 0.7rem;
      border: none;
      border-radius: 5px;
      background: #222;
      color: #fff;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem;
    }

    .link-card {
      background: #1b1b1b;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.2s ease, background 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .link-card:hover {
      transform: translateY(-4px);
      background: #222;
    }

    iframe {
      border: none;
      flex-grow: 1;
      width: 100%;
      height: 70vh;
      background: #000;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 1rem;
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🕶️ Incognito Access Portal</h1>
    <p>Explore the web privately — in a contained frame.</p>
  </header>

  <div class="browser">
    <div class="toolbar">
      <button onclick="goBack()">⬅️</button>
      <button onclick="goForward()">➡️</button>
      <input type="text" id="address" placeholder="Enter URL or search term..." onkeydown="if(event.key==='Enter') loadAddress()">
      <button onclick="loadAddress()">Go</button>
    </div>

    <div class="links">
      <div class="link-card" onclick="openSite('https://www.google.com')">Google</div>
      <div class="link-card" onclick="openSite('https://www.youtube.com')">YouTube</div>
      <div class="link-card" onclick="openSite('https://www.wikipedia.org')">Wikipedia</div>
      <div class="link-card" onclick="openSite('https://www.reddit.com')">Reddit</div>
      <div class="link-card" onclick="openSite('https://www.twitter.com')">Twitter (X)</div>
      <div class="link-card" onclick="openSite('https://www.gmail.com')">Gmail</div>
    </div>

    <iframe id="browserFrame" src="about:blank"></iframe>
  </div>

  <footer>
    © 2025 Gaspard | Built with 💡 and a lot of curiosity.
  </footer>

  <script>
    const frame = document.getElementById('browserFrame');
    const addressInput = document.getElementById('address');
    const historyStack = [];
    let currentIndex = -1;

    function openSite(url) {
      frame.src = url;
      addressInput.value = url;
      historyStack.push(url);
      currentIndex = historyStack.length - 1;
    }

    function loadAddress() {
      let input = addressInput.value.trim();
      if (!input) return;
      if (!input.startsWith('http')) {
        input = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
      }
      openSite(input);
    }

    function goBack() {
      if (currentIndex > 0) {
        currentIndex--;
        frame.src = historyStack[currentIndex];
        addressInput.value = historyStack[currentIndex];
      }
    }

    function goForward() {
      if (currentIndex < historyStack.length - 1) {
        currentIndex++;
        frame.src = historyStack[currentIndex];
        addressInput.value = historyStack[currentIndex];
      }
    }
  </script>
</body>
</html>
